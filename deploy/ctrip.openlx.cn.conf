server {
    listen 80;
    server_name ctrip.openlx.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/openlx-ctrip-hotel-ops/public;
        default_type text/plain;
    }
    location / { return 301 https://ctrip.openlx.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name ctrip.openlx.cn;
    ssl_certificate /www/server/panel/vhost/cert/ctrip.openlx.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ctrip.openlx.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CTRIPSSL:1m;
    client_max_body_size 1m;
    access_log /www/wwwlogs/ctrip.openlx.cn.log;
    error_log /www/wwwlogs/ctrip.openlx.cn.error.log;
    location / {
        proxy_pass http://127.0.0.1:1986;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
