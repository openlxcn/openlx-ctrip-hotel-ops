<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenLX 系列会员中心</title><meta name="robots" content="noindex"><script defer src="/series.js"></script><style>body{font:16px/1.7 system-ui,sans-serif;color:#183048;background:#f6f8fc;margin:0}main{max-width:1040px;margin:0 auto;padding:40px 22px}a{color:#1968cf}h1{font-size:36px;line-height:1.3}section{background:white;border:1px solid #dce6f1;border-radius:16px;padding:24px;margin:20px 0}input,button{font:inherit;padding:12px;border:1px solid #ccd8e7;border-radius:8px}label{display:block;margin:12px 0}button{background:#1764ca;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;display:block;overflow:auto}td,th{padding:8px;border-bottom:1px solid #e2e8ee;text-align:left;white-space:nowrap}.muted{color:#556b80}#status{white-space:pre-wrap}</style></head><body><main><a href="/">← OpenLX</a><h1>一个账号，查看整个 OpenLX 系列</h1><p>账号信息来自同一用户数据库，系列订单与权益按产品显示。已购买的产品权益分别生效，跨产品通票尚未开售。</p><p id="status" role="status"></p><section id="login-box" hidden><h2>登录 OpenLX</h2><p>使用 wx.openlx.cn 的账号与密码。</p><form id="login"><label>邮箱／手机号 <input name="account" autocomplete="username" required></label><label>密码 <input name="password" type="password" autocomplete="current-password" required></label><button>登录并查看</button></form></section><div id="overview"></div><p class="muted">各产品业务变更通常在15秒内同步；同步异常时显示最后同步时间。微信公众号原订单及权益实时读取，不复制 API 密钥、密码或平台登录资料。</p></main></body></html>
